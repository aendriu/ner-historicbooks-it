services:
  backend:
    build:
      context: ./backend
    container_name: tirocinio-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
      - NER_MODEL_NAME=${NER_MODEL_NAME:-aendriu/bert-ner-italian-historical}
      - NER_SCORE_THRESHOLD=${NER_SCORE_THRESHOLD:-0.65}
      - NER_MIN_ENTITY_CHARS=${NER_MIN_ENTITY_CHARS:-3}
      - SEMANTIC_EMBEDDING_MODEL=${SEMANTIC_EMBEDDING_MODEL:-bge-m3}
      - SEMANTIC_SIMILARITY_THRESHOLD=${SEMANTIC_SIMILARITY_THRESHOLD:-0.5}
      - DB_FILENAME=${DB_FILENAME:-historicbooks.db}
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tirocinio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
