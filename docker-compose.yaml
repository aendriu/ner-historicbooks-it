services:
  backend:
    build:
      context: ./backend
    container_name: tirocinio-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_PORT=11434
      - OLLAMA_MODEL=qwen3.5:9b
      - NER_SCORE_THRESHOLD=0.65
      - SEMANTIC_SIMILARITY_THRESHOLD=0.5
    env_file:
      - ./.env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tirocinio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
